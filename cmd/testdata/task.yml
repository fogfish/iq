input:
  name: rainbow

prompt: |
  TOOL:return
  <codeblock>
  Use available tools to complete the workflow:
  (1) Create files, each file contains the one color of {{.name}};
  (2) Write short story 2 - 3 sentences about content of each file, replacing the original one;
  (3) Merge all stories into single file story.txt;
  (4) Empasis all color names in the story.txt with using markdown syntax. (e.g. *red*);
  (5) Read the story.txt and return its content.
  </codeblock>

registry:
  - bash
