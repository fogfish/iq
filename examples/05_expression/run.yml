name: expression
jobs:
  main:
    steps:
      - name: extract
        uses: prompts/extract.md

      - name: choice
        switch:
          - when: steps.extract.category == "laptop"
            route: laptop
        default: unknown

  laptop:
    steps:
      - uses: prompts/transform.md

  unknown:
    steps:
      - uses: prompts/unknown.md
